<!doctype html>
<html lang="es-AR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seguí tu compra · XOXO Tecno</title>
  <meta name="description" content="Escribí el código de tu compra y tu email para ver en qué anda tu pedido y descargar el comprobante.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2b4966">
  <link rel="icon" href="/media/marca/xoxo-avatar.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="{{asset:/shared/seguir-pedido.css}}">
</head>
<body>
  <header class="sp-head">
    <a class="sp-logo" href="/" aria-label="XOXO Tecno, volver a la tienda"><img src="/media/marca/xoxo-horizontal-azul.svg" alt="XOXO Tecno" width="120" height="49"></a>
    <a class="sp-volver" href="/">Volver a la tienda</a>
  </header>
  <script>(function () { var v = null; try { v = localStorage.getItem('xoxo:volver'); } catch (e) {} if (v && /^\/(?:[\w-]+\/)*(?:\?[^#]*)?$/.test(v)) document.querySelectorAll('.sp-logo, .sp-volver').forEach(function (a) { a.setAttribute('href', v); }); })();</script>
  <main class="sp">
    <section class="sp-buscar">
      <h1>Seguí tu compra</h1>
      <p>Escribí el código de tu compra (está en el mail que te mandamos y en el comprobante) y el email con el que compraste.</p>
      <form class="sp-form" novalidate>
        <label><span>Código de compra</span><input name="pedido" placeholder="#K7Q2MA" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>
        <label><span>Email</span><input name="email" type="email" placeholder="tu@email.com" autocomplete="email" inputmode="email" required></label>
        <button type="submit">Ver mi pedido</button>
      </form>
      <p class="sp-error" role="alert" hidden></p>
    </section>
    <section class="sp-res" aria-live="polite" hidden></section>
  </main>
  {{datos}}
  <script src="{{asset:/shared/seguir-pedido.js}}"></script>
</body>
</html>
