<!doctype html>
<html data-theme="light" lang="es-AR" data-cat="{{cat}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{titulo}}</title>
  <meta name="description" content="{{descripcion}}">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="{{texto:seoTitle}}">
  <meta property="og:description" content="{{texto:seoDescription}}">
  <meta property="og:image" content="{{og_image}}">
  <link rel="icon" href="/media/marca/xoxo-avatar.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" href="{{asset:/minimalista/css/styles.css}}">
  <link rel="stylesheet" href="{{asset:/shared/vidriera.css}}">
  <link rel="stylesheet" href="{{asset:/shared/checkout.css}}">
  <link rel="stylesheet" href="{{asset:/shared/flash.css}}">
  <link rel="stylesheet" href="{{asset:/shared/secciones.css}}">
  <!-- Aplica el modo claro/oscuro que eligió el visitante antes de pintar la página (evita un parpadeo) -->
  <script>(function () { var t = 'light'; try { if (localStorage.getItem('xoxo:tema') === 'dark') t = 'dark'; } catch (e) {} document.documentElement.dataset.theme = t; })();</script>
</head>
<body>

  <header class="head">
    <a class="logo js-home" href="/minimalista/" aria-label="XOXO Tecno, inicio">
      <span class="logo-xoxo"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 667 270"><g transform="translate(6 6)" fill="none" stroke="currentColor" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)"><path d="M3 5L52 75"/><path d="M28 5L75 72L2 177"/><path d="M140 5L70 110L108 165"/><path d="M83 50L106 16"/><path d="M35 165L59 133"/><path d="M93 108L140 177"/><circle cx="112" cy="5" r="4.1" fill="currentColor" stroke="none"/></g><g transform="translate(157 0)"><path d="M51 9.5A80 87 0 1 0 79.5 2.0999999999999943L76.5 24A58 65 0 1 0 99.9 27"/><circle cx="60.5" cy="5.700000000000003" r="4.1" fill="currentColor" stroke="none"/></g><g transform="translate(335 0)"><path d="M3 5L52 75"/><path d="M28 5L75 72L2 177"/><path d="M140 5L70 110L108 165"/><path d="M83 50L106 16"/><path d="M35 165L59 133"/><path d="M93 108L140 177"/><circle cx="112" cy="5" r="4.1" fill="currentColor" stroke="none"/></g><g transform="translate(492 0)"><path d="M51 9.5A80 87 0 1 0 79.5 2.0999999999999943L76.5 24A58 65 0 1 0 99.9 27"/><circle cx="60.5" cy="5.700000000000003" r="4.1" fill="currentColor" stroke="none"/></g><g transform="translate(257.28499999999997 252) scale(0.93)" stroke-width="2.6" fill="none"><path transform="translate(0 0)" d="M6 -36V-7Q6 0 13 0M0 -27H13"/><path transform="translate(22 0)" d="M1 -14H27.5A13.5 13.5 0 1 0 23.5 -4.5"/><path transform="translate(57 0)" d="M24 -23A14 14 0 1 0 24 -5"/><path transform="translate(89 0)" d="M1.5 -28V0M1.5 -15C1.5 -24 8 -28 14 -28C21 -28 25 -23 25 -15V0"/><circle cx="137" cy="-14" r="13.5"/><circle cx="137" cy="-38" r="2.6" fill="currentColor" stroke="none"/></g></g></svg></span>
    </a>
    <div class="nav" id="nav"></div>
    <div class="head-right">
      <button class="head-fav head-theme js-theme" type="button" aria-label="Cambiar entre modo claro y oscuro"></button>
      <button class="head-fav js-favs" type="button" aria-pressed="false" aria-label="Tus me gusta" data-icon="heart">
        <span class="fav-count js-like-count" hidden></span>
      </button>
      <a class="head-wa js-wa js-wa-general" data-icon="wa" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp"><span>WhatsApp</span></a>
    </div>
  </header>

  <main>
    <!-- Inicio: portada, marcas, catálogo y recomendados -->
    <div id="home">
      <section class="hero">
        <div class="hero-media" id="hero-media"></div>
        <div class="hero-copy">
          <p class="hero-kicker" id="hero-kicker"></p>
          {{hero_logo}}
          <h1 class="hero-title">{{texto:heroTitle1}}<br>{{texto:heroTitle2}}</h1>
          <p class="hero-text" id="hero-text"></p>
          <div class="hero-ctas">
            <a class="btn-pill js-catalog" href="#catalogo">Ver celulares</a>
            <button class="btn-pill ghost js-shorts-all" type="button">Mirá los videos</button>
          </div>
        </div>
      </section>

      <section class="sucursales" id="sucursales" aria-labelledby="sucursales-title">
        <h2 class="sec-title" id="sucursales-title">Nuestras sucursales</h2>
        <ul class="suc-list">{{sucursales}}</ul>
      </section>

      <section class="section">
        <h2 class="sec-title">¿Qué estás buscando?</h2>
        <div class="brand-row" id="brand-row"></div>
      </section>

      <section class="plp" id="catalogo">
        <div class="plp-head">
          <h2 class="plp-title"><span id="plp-title">Celulares</span> <span class="count" id="plp-count"></span></h2>
          <div class="plp-tools">
            <button class="tool js-filters" type="button" aria-controls="filters" aria-expanded="true">
              <span class="t-desk">Ocultar filtros</span><span class="t-mob">Filtrar</span><span data-icon="filter"></span>
            </button>
            <label class="tool sort">
              <span>Ordenar por</span>
              <select id="sort">
                <option value="destacados">Destacados</option>
                <option value="menor">Menor cuota</option>
                <option value="mayor">Mayor cuota</option>
                <option value="memoria">Más memoria</option>
              </select>
            </label>
          </div>
        </div>
        <div class="plp-body">
          <aside class="filters" id="filters" aria-label="Filtros">
            <div class="filters-head">
              <b>Filtrar</b>
              <button class="icon-btn js-sheet-close" type="button" aria-label="Cerrar filtros" data-icon="close"></button>
            </div>
            <div id="filter-groups"></div>
            <div class="filters-foot">
              <button class="btn-pill ghost js-clear" type="button">Borrar</button>
              <button class="btn-pill js-sheet-close js-apply" type="button">Ver resultados</button>
            </div>
          </aside>
          <div class="grid" id="grid"></div>
        </div>
      </section>

      <section class="plp extras" id="contenido"></section>

      <section class="recs" id="recs-home"></section>
    </div>

    <!-- Página de producto -->
    <div id="product" hidden></div>
  </main>

  <footer class="foot">
    <div class="foot-brand">
      <span class="tb" aria-hidden="true"><img src="/media/marca/xoxo-isotipo-blanco.svg" alt=""></span>
      <div><b data-store="name"></b><span>📍 <span data-store="city"></span></span></div>
    </div>
    <ul class="foot-sucursales">{{sucursales}}</ul>
    <ul class="foot-links" id="foot-links">
      <li><a class="js-wa js-wa-general" target="_blank" rel="noopener">Escribinos por WhatsApp</a></li>
      <li><a href="/seguimiento">Seguí tu compra</a></li>
      <li><span class="js-financing">Financiá con <span data-store="financing"></span></span></li>
    </ul>
    <p class="foot-info" id="foot-info"></p>
    <p class="foot-legal">© <span id="year"></span> <span data-store="name"></span> · <span data-store="city"></span><span id="foot-legal-extra"></span></p>
  </footer>

  <a class="fab js-wa js-wa-general" data-icon="wa" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp"></a>
  <div class="scrim" id="scrim" hidden></div>

  <!-- Modo video: pantalla completa, un celular por pantalla, deslizar para el siguiente -->
  <div class="shorts" id="shorts" role="dialog" aria-modal="true" aria-label="Videos de los celulares" hidden>
    <div class="shorts-stage">
      <button class="shorts-close js-close" id="shorts-close" type="button" aria-label="Cerrar" data-icon="close"></button>
      <div class="shorts-track" id="shorts-track"></div>
      <p class="shorts-hint" id="shorts-hint"></p>
    </div>
    <div class="shorts-nav">
      <button type="button" id="shorts-prev" aria-label="Anterior" data-icon="up"></button>
      <button type="button" id="shorts-next" aria-label="Siguiente" data-icon="down"></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  {{datos}}
  <script src="{{asset:/shared/seguimiento.js}}" data-variante="minimalista"></script>
  <script src="{{asset:/shared/envios.js}}"></script>
  <script src="{{asset:/shared/flash.js}}"></script>
  {{pago}}
  <script src="{{asset:/shared/vidriera.js}}" data-preview></script>
  <script src="{{asset:/shared/secciones.js}}"></script>
  <script src="{{asset:/minimalista/js/app.js}}"></script>
</body>
</html>
