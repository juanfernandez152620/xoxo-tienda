# Bloque "location /" del sitio en nginx (/etc/nginx/sites-available/vps-4728832-x). Esta es la copia de referencia:
# nginx recibe las visitas con https y se las pasa a la tienda, que escucha solo dentro del servidor.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
